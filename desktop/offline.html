<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>PDF-Stift</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #E9ECF2; font: 16px system-ui, "Segoe UI", sans-serif; color: #1B1F29; }
  .box { background: #fff; border-radius: 16px; padding: 32px 36px; max-width: 460px; box-shadow: 0 6px 24px rgba(0,0,0,.08); text-align: center; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { color: #6B7280; line-height: 1.5; }
  button { margin-top: 12px; font: inherit; font-weight: 600; color: #fff; background: #1E2F6E; border: 0; border-radius: 12px; padding: 10px 22px; cursor: pointer; }
</style></head>
<body><div class="box">
  <h1>Keine Verbindung zu pdf-stift.example.org</h1>
  <p>Beim allerersten Start braucht PDF-Stift Internet. Danach funktionieren PDFs, die schon einmal geöffnet waren, auch ohne Verbindung.</p>
  <button onclick="location.href='https://pdf-stift.example.org/'">Erneut versuchen</button>
</div></body></html>
