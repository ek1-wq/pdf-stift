; PHP settings for the built-in local server of PDF-Stift (only reachable from this PC)
; extension_dir is passed on the command line by local.js
extension=mbstring
extension=fileinfo
extension=openssl
extension=curl
extension=zip
extension=pdo_sqlite
extension=sqlite3
memory_limit=1024M
upload_max_filesize=2048M
post_max_size=2100M
max_file_uploads=200
max_execution_time=0
max_input_time=-1
display_errors=Off
log_errors=On
error_reporting=E_ALL & ~E_DEPRECATED
date.timezone=UTC
default_charset=UTF-8
zlib.output_compression=Off
