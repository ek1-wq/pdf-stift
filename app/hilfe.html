<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PDF-Stift – Quick guide</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
// Die Kurzanleitung ist eine Spalte im Hauptfenster von PDF-Stift. Ältere Windows-Apps öffnen noch dieses Fenster:
// dann das Hauptfenster bitten, die Spalte zu zeigen, und dieses Fenster schließen. Ohne laufendes PDF-Stift: die Seite selbst zeigen.
(function () {
  var ed = /(^|[?&])ed=local(&|$)/.test(location.search.slice(1)) ? 'local' : 'server';
  var lang = 'en';
  try { var s = JSON.parse(localStorage.getItem('pdfstift.settings') || '{}'); if (s.helpLang === 'de') lang = 'de'; } catch (e) {}
  var done = false;
  try {
    var bc = new BroadcastChannel('pdfstift-help');
    bc.onmessage = function (ev) { if (ev.data === 'ok') { done = true; window.close(); setTimeout(function () { document.body.innerHTML = '<p style="font:16px sans-serif;margin:2em">The quick guide is shown in the main PDF-Stift window. / Die Kurzanleitung wird im Hauptfenster von PDF-Stift angezeigt.</p>'; }, 300); } };
    bc.postMessage('open');
  } catch (e) {}
  setTimeout(function () { if (!done) location.replace('hilfe/kurzanleitung-' + ed + '.' + lang + '.html'); }, 700);
})();
</script>
</head><body></body></html>
