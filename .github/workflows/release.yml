name: Build Windows and Linux apps
# Builds the Windows installer and the Linux packages with a bundled PHP runtime (tools/build-windows.sh, tools/build-linux.sh),
# plus the server package for your own web server.
#  - push to main that changes the version in desktop/package.json, or push of a tag "v1.2.3"
#      → builds that version and publishes it as a GitHub release (installed apps then show "Update available")
#  - manual run → publishes the version in desktop/package.json if it has no release yet, otherwise builds only
on:
  push:
    branches: [main]
    paths: ['desktop/package.json']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    outputs:
      mode: ${{ steps.build.outputs.mode }}
      version: ${{ steps.build.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="$(node -p "require('./desktop/package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; MODE=publish
          elif ! gh release view "v$V" >/dev/null 2>&1; then MODE=publish
          else MODE=build; fi
          echo "version $V – $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"; echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = publish ]; then tools/build-windows.sh "$V" publish; else tools/build-windows.sh "$V"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Stift-Setup
          path: desktop/dist/*.exe
  check-windows:
    # installs the published Windows installer on a fresh machine and tests start, quick guide, Word → PDF and PowerPoint;
    # if anything fails, the release is turned into a pre-release so that installed apps and the demo do not pick it up
    needs: windows
    if: needs.windows.outputs.mode == 'publish'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          V="${{ needs.windows.outputs.version }}"
          mkdir -p wt
          gh release download "v$V" -p "PDF-Stift-Setup-$V.exe" -O setup.exe
          SECONDS=0
          powershell -NoProfile -Command "\$p = Start-Process .\setup.exe -ArgumentList '/S' -PassThru; if (-not \$p.WaitForExit(1500000)) { exit 1 }; exit \$p.ExitCode"
          echo "installed in ${SECONDS}s"
          EXE="$(find "$LOCALAPPDATA/Programs" -iname 'PDF-Stift.exe' 2>/dev/null | head -1)"
          [ -n "$EXE" ] || { echo "program not found"; exit 1; }
          echo "$EXE" > wt/exe.txt
          D="$(dirname "$EXE")"; du -sh "$D"
          mkdir -p tf; printf 'Dear reader,\n\nthis is a test letter for PDF-Stift.\n' > tf/brief.txt
          MSYS_NO_PATHCONV=1 timeout 300 "$D/resources/libreoffice/program/soffice.com" --headless --norestore "-env:UserInstallation=file:///$(cygpath -m "$PWD/tf")/profil" --convert-to docx --outdir "$(cygpath -w "$PWD/tf")" "$(cygpath -w "$PWD/tf/brief.txt")"
          [ -s tf/brief.docx ]
      - name: Test
        run: |
          mkdir -p wtn && cd wtn && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.48.2 >/dev/null 2>&1; cd ..
          NODE_PATH="$PWD/wtn/node_modules" node tools/check/windows-test.js "$(cat wt/exe.txt)" "$(cygpath -w "$PWD/tf/brief.docx")" "$(cygpath -w "$PWD/tools/check/sample.pptx")" "$(cygpath -w "$PWD/wt")"
          cat wt/test.txt
          grep -q 'Quick guide\|Kurzanleitung' wt/test.txt
          grep -q 'Word → PDF: ok' wt/test.txt
          grep -q '"pptxpdf":200' wt/test.txt
          ! grep -q 'SEITENFEHLER\|ABBRUCH' wt/test.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-check
          path: wt
      - name: Withdraw the release if the check failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ needs.windows.outputs.version }}" --prerelease
  check-android:
    # starts the Android app in an emulator (offline mode, notebook page); a crash or freeze turns the release into a pre-release
    needs: [windows, android]
    if: needs.windows.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: PDF-Stift-Android
          path: apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator and test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 10
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/check/android-test.sh "$PWD/aout" "$(ls $PWD/apk/*.apk | head -1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-check
          path: aout
      - name: Withdraw the release if the check failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ needs.windows.outputs.version }}" --prerelease
  linux:
    # after Windows, so that both upload into the same release
    needs: windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tools for the start test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libfuse2 >/dev/null
      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ needs.windows.outputs.version }}"
          M=""; [ "${{ needs.windows.outputs.mode }}" = publish ] && M=publish
          set +e; tools/build-linux.sh "$V" $M 2>&1 | tee /tmp/build.log; EC=${PIPESTATUS[0]}; set -e
          # Fehler als Hinweis am Lauf sichtbar machen (die Protokolle selbst sind nicht überall abrufbar)
          if [ "$EC" != 0 ]; then echo "::error title=build-linux::$(tail -c 1800 /tmp/build.log | tr '\n' '|' | tr -d '\r')"; exit "$EC"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Stift-Linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.zip
  android:
    # Android app (online with your own server, or offline); signed with the key from the repository secrets
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          V="${{ needs.windows.outputs.version }}"
          cd android
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > app/release.jks; SIGNED=1
          else
            # no key in the secrets yet: build with a throw-away key (not published, updates would not install over it)
            export ANDROID_KEYSTORE_PASSWORD=ci-only-key
            keytool -genkeypair -keystore app/release.jks -alias pdfstift -keyalg RSA -keysize 2048 -validity 1 -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" -dname "CN=CI" >/dev/null
            SIGNED=0; echo "::warning::ANDROID_KEYSTORE secret missing – APK built with a temporary key and not published"
          fi
          set +e; PDFSTIFT_VERSION="$V" gradle --no-daemon assembleGithubRelease bundlePlayRelease 2>&1 | tee /tmp/build.log; EC=${PIPESTATUS[0]}; set -e
          if [ "$EC" != 0 ]; then echo "::error title=android::$(grep -E '^e: |error:|What went wrong' -A2 /tmp/build.log | head -40 | tr '\n' '|')"; exit "$EC"; fi
          mkdir -p dist && cp app/build/outputs/apk/github/release/app-github-release.apk "dist/PDF-Stift-$V.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "dist/PDF-Stift-$V-play.aab"
          # Google Play: native libraries must suit 16 KB memory pages
          python3 ../tools/check-16k.py "dist/PDF-Stift-$V.apk" "dist/PDF-Stift-$V-play.aab" || echo "::warning title=16 KB::a native library is not aligned for 16 KB pages"
          # signed APK into the release of this version (also later by a manual run, once the key is in the secrets)
          if [ "$SIGNED" = 1 ] && gh release view "v$V" >/dev/null 2>&1; then gh release upload "v$V" "dist/PDF-Stift-$V.apk" "dist/PDF-Stift-$V-play.aab" --clobber; fi
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Stift-Android
          path: android/dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          # for the Play Console (Google Play): download from this run
          name: PDF-Stift-Google-Play
          path: android/dist/*.aab
