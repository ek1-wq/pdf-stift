name: Build Windows app
# Builds the Windows installer with a bundled PHP runtime (see tools/build-windows.sh).
#  - push of a tag "v1.2.3"  → builds version 1.2.3 and publishes it as a GitHub release;
#    installed apps then show "Update available"
#  - manual run              → builds only; the installer is attached to the run as an artifact
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tools/build-windows.sh "${GITHUB_REF_NAME#v}" publish
          else tools/build-windows.sh "$(node -p "require('./desktop/package.json').version")"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Stift-Setup
          path: desktop/dist/*.exe
