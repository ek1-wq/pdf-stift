name: Build Windows app
# Builds the Windows installer with a bundled PHP runtime (see tools/build-windows.sh).
#  - push to main that changes the version in desktop/package.json, or push of a tag "v1.2.3"
#      → builds that version and publishes it as a GitHub release (installed apps then show "Update available")
#  - manual run → builds only; the installer is attached to the run as an artifact
on:
  push:
    branches: [main]
    paths: ['desktop/package.json']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="$(node -p "require('./desktop/package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; MODE=publish
          elif [[ "$GITHUB_EVENT_NAME" == push ]] && ! gh release view "v$V" >/dev/null 2>&1; then MODE=publish
          else MODE=build; fi
          echo "version $V – $MODE"
          if [ "$MODE" = publish ]; then tools/build-windows.sh "$V" publish; else tools/build-windows.sh "$V"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Stift-Setup
          path: desktop/dist/*.exe
