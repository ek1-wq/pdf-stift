# Android check: builds both editions (GitHub and Google Play), checks 16 KB alignment,
# runs the app in an emulator (Android 11 and Android 16) and keeps screenshots as an artifact.
name: Android check
on:
  workflow_dispatch:
  push:
    branches: [next]
    paths: ['android/**', 'tools/android-screens.sh', '.github/workflows/android-check.yml']
permissions:
  contents: write
jobs:
  emulator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Build
        run: |
          cd android
          set +e; gradle --no-daemon assembleGithubDebug bundlePlayDebug 2>&1 | tee /tmp/b.log; EC=${PIPESTATUS[0]}; set -e
          if [ "$EC" != 0 ]; then echo "::error title=build::$(grep -E '^e: |error:|What went wrong' -A3 /tmp/b.log | head -40 | tr '\n' '|')"; exit 1; fi
          mkdir -p /tmp/shots/api${{ matrix.api }}
          python3 ../tools/check-16k.py app/build/outputs/apk/github/debug/app-github-debug.apk app/build/outputs/bundle/playDebug/app-play-debug.aab > /tmp/shots/api${{ matrix.api }}/16k.txt 2>&1 || echo "::warning title=16 KB::$(grep FAIL /tmp/shots/api${{ matrix.api }}/16k.txt | tr '\n' '|')"
          if unzip -p app/build/outputs/bundle/playDebug/app-play-debug.aab base/manifest/AndroidManifest.xml | strings | grep -q INSTALL_PACKAGES; then echo "::error title=play::install permission still in the Play bundle"; else echo "Play manifest clean"; fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: tools/android-screens.sh /tmp/shots/api${{ matrix.api }} android/app/build/outputs/apk/github/debug/app-github-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-api${{ matrix.api }}
          path: /tmp/shots/
      - name: Screenshots on a temporary branch (removed again after 10 minutes)
        if: always()
        run: |
          B=ci-screens-${{ matrix.api }}
          cd /tmp/shots && git init -q -b "$B" && git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm screenshots
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$B"
          sleep 600
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete "$B" || true
